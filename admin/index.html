<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor Billing Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/config.js?v=3"></script>
<style>
:root{
  --navy-950:#0a1730; --navy-900:#10254B; --navy-800:#16305e; --navy-700:#1c3c72;
  --royal-600:#1E4FA3; --royal-500:#2f63c4; --royal-100:#e8eefb;
  --steel-400:#6f93c9; --steel-200:#c3d4ec;
  --ice-50:#F7F9FC; --ice-100:#EEF2F8; --ice-200:#e4e9f2;
  --slate-400:#94a3b8; --slate-500:#64748B; --slate-600:#475569; --slate-700:#334155; --slate-900:#0f172a;
  --amber-500:#F5A623; --amber-600:#DB8F13; --amber-100:#fdf1da;
  --success:#16A34A; --success-bg:#e9f9ef;
  --warn:#D97706; --warn-bg:#fef3e2;
  --danger:#DC2626; --danger-bg:#fdeaea;
  --white:#ffffff; --border:#E2E8F0;
  --bg:var(--ice-50); --surface:var(--white); --text:var(--slate-900); --text-muted:var(--slate-500);
  --shadow-sm:0 1px 2px rgba(16,37,75,.06); --shadow-md:0 4px 16px rgba(16,37,75,.08); --shadow-lg:0 12px 32px rgba(16,37,75,.14);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0b1526; --surface:#101d34; --text:#e7edf7; --text-muted:#93a3bd; --border:#223451;
  --ice-100:#16233d; --royal-100:#152a4d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased; transition:background .25s ease,color .25s ease;
  min-height:100vh;
}
h1,h2,h3,.brand-font{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.ar{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:isolate;}
::selection{background:var(--amber-100);color:var(--navy-900);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--steel-200);border-radius:8px;}

/* ---------- Layout ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px; background:linear-gradient(180deg,var(--navy-950),var(--navy-900) 55%,var(--navy-800));
  color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand img{width:36px;height:36px;border-radius:9px;object-fit:cover;}
.sidebar-brand .name{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;line-height:1.25;}
.sidebar-brand .sub{font-size:10.5px;color:var(--steel-400);letter-spacing:.04em;text-transform:uppercase;}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c9d6ee;
  font-size:13.5px;font-weight:500;border:none;background:transparent;text-align:left;width:100%;
  transition:background .15s ease,color .15s ease;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,var(--royal-600),var(--royal-500));color:#fff;box-shadow:0 4px 14px rgba(30,79,163,.4);}
.nav-divider{height:1px;background:rgba(255,255,255,.08);margin:10px 8px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--steel-400);padding:12px 12px 4px;}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.logout-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);color:#e2e8f0;font-size:13px;border:1px solid rgba(255,255,255,.08);}
.logout-btn:hover{background:rgba(255,255,255,.1);}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:14px 28px;backdrop-filter:blur(6px);
}
.topbar h1{font-size:17px;margin:0;font-weight:700;}
.topbar .crumb{font-size:12px;color:var(--text-muted);margin-top:2px;}
.content{padding:26px 28px 60px;max-width:1320px;}

.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.icon-btn:hover{background:var(--ice-100);color:var(--text);}
.icon-btn svg{width:16px;height:16px;}

/* ---------- Cards / KPI ---------- */
.grid{display:grid;gap:18px;}
.kpi-grid{grid-template-columns:repeat(4,1fr);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.kpi-card{padding:20px 20px 18px;position:relative;overflow:hidden;}
.kpi-card .label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.kpi-card .value{font-family:'JetBrains Mono';font-weight:700;font-size:26px;margin-top:8px;color:var(--navy-900);}
html[data-theme="dark"] .kpi-card .value{color:#fff;}
.kpi-card .sub{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
.kpi-accent{position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;opacity:.14;}

.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px;}
.section-title .tick{width:4px;height:18px;background:var(--amber-500);border-radius:3px;}
.section-title h2{font-size:15px;margin:0;font-weight:700;}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .1s ease, box-shadow .15s ease, background .15s ease;}
.btn svg{width:15px;height:15px;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(180deg,var(--royal-500),var(--royal-600));color:#fff;box-shadow:0 4px 12px rgba(30,79,163,.28);}
.btn-primary:hover{box-shadow:0 6px 16px rgba(30,79,163,.38);}
.btn-amber{background:linear-gradient(180deg,#ffb84d,var(--amber-500));color:var(--navy-950);box-shadow:0 4px 12px rgba(245,166,35,.3);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--ice-100);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--ice-100);color:var(--text);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#fbdada;}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.quick-grid{grid-template-columns:repeat(4,1fr);}
.quick-card{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--border);}
.quick-card .qi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.quick-card .qi svg{width:19px;height:19px;}
.quick-card .qt{font-weight:700;font-size:13.5px;}
.quick-card .qs{font-size:11.5px;color:var(--text-muted);}
.quick-card:hover{border-color:var(--royal-500);box-shadow:var(--shadow-md);}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);}
.field .req{color:var(--danger);}
.input,select.input,textarea.input{
  padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:13.5px;outline:none;transition:border-color .15s ease, box-shadow .15s ease;width:100%;
}
.input:focus{border-color:var(--royal-500);box-shadow:0 0 0 3px var(--royal-100);}
textarea.input{resize:vertical;min-height:70px;}
.checkbox-row{display:flex;align-items:center;gap:9px;}
.checkbox-row input{width:17px;height:17px;accent-color:var(--royal-600);}

.panel{padding:22px 24px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.panel-head h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.panel-head h3 svg{width:16px;height:16px;color:var(--royal-600);}

/* ---------- Items table ---------- */
table{width:100%;border-collapse:collapse;}
.items-table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);}
.items-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.items-table input{padding:8px 9px;font-size:13px;}
.items-table .col-qty{width:80px;} .items-table .col-price{width:120px;} .items-table .col-total{width:120px;} .items-table .col-del{width:38px;}
.row-total{font-family:'JetBrains Mono';font-weight:600;font-size:13px;}
.add-row-btn{margin-top:10px;}

.totals-box{margin-top:16px;margin-left:auto;width:320px;background:var(--ice-100);border-radius:12px;padding:16px 18px;}
.totals-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-muted);}
.totals-line b{color:var(--text);font-family:'JetBrains Mono';}
.totals-grand{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px dashed var(--steel-200);font-size:16px;font-weight:700;}
.totals-grand span:last-child{font-family:'JetBrains Mono';color:var(--navy-900);}
html[data-theme="dark"] .totals-grand span:last-child{color:#fff;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.badge-paid{background:var(--success-bg);color:var(--success);}
.badge-partial{background:var(--warn-bg);color:var(--warn);}
.badge-unpaid{background:var(--danger-bg);color:var(--danger);}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ---------- History table ---------- */
.data-table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{text-align:left;padding:10px 14px;background:var(--ice-100);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;}
.data-table th:first-child{border-radius:9px 0 0 9px;} .data-table th:last-child{border-radius:0 9px 9px 0;}
.data-table td{padding:11px 14px;border-bottom:1px solid var(--border);}
.data-table tr:hover td{background:var(--ice-50);}
html[data-theme="dark"] .data-table tr:hover td{background:var(--ice-100);}
.inv-num{font-family:'JetBrains Mono';font-weight:700;color:var(--royal-600);}
.actions-cell{display:flex;gap:5px;flex-wrap:wrap;}

.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:220px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);}
.search-wrap input{padding-left:36px;}
.chip{padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
.chip.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state svg{width:44px;height:44px;margin-bottom:12px;opacity:.5;}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:15px;}
.empty-state p{margin:0;font-size:13px;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,var(--navy-800),var(--navy-950) 65%);padding:20px;position:relative;overflow:hidden;}
.login-wrap::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;}
.login-card{position:relative;z-index:1;width:400px;background:rgba(16,27,52,.7);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.login-logo img{width:62px;height:62px;border-radius:16px;}
.login-logo .name{color:#fff;font-weight:700;font-size:15.5px;text-align:center;line-height:1.3;}
.login-logo .tag{color:var(--steel-400);font-size:11.5px;text-align:center;}
.login-card .field label{color:#c9d6ee;}
.login-card .input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff;}
.login-card .input::placeholder{color:#7f8fae;}
.login-error{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#ffb3b3;font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:14px;}
.forgot-link{font-size:12px;color:var(--steel-400);text-align:right;display:block;margin-top:-8px;margin-bottom:14px;cursor:pointer;}
.forgot-link:hover{color:#fff;}
.login-foot{margin-top:20px;text-align:center;font-size:11px;color:var(--steel-400);}

/* ---------- Invoice view / PDF preview panel ---------- */
.invoice-view-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
.doc-preview{background:#fff;border-radius:14px;padding:34px 32px;box-shadow:var(--shadow-lg);color:#111;border:1px solid var(--border);}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy-900);padding-bottom:16px;margin-bottom:18px;}
.doc-head .co{display:flex;gap:12px;}
.doc-head img{width:52px;height:52px;border-radius:10px;}
.doc-head .co-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--navy-900);}
.doc-head .co-meta{font-size:11px;color:#555;line-height:1.6;margin-top:3px;}
.doc-head .inv-meta{text-align:right;}
.doc-head .inv-tag{font-family:'JetBrains Mono';background:var(--navy-900);color:#fff;padding:5px 12px;border-radius:7px;font-size:12px;letter-spacing:.04em;font-weight:700;}
.doc-head .inv-date{font-size:11.5px;color:#555;margin-top:6px;}
.doc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.doc-box{background:#f7f9fc;border-radius:10px;padding:12px 14px;}
.doc-box .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#8493a8;font-weight:700;margin-bottom:6px;}
.doc-box .r{font-size:12.5px;color:#233;padding:2px 0;}
.doc-table{width:100%;border-collapse:collapse;margin-top:8px;}
.doc-table th{background:var(--navy-900);color:#fff;font-size:10.5px;text-transform:uppercase;padding:8px 10px;text-align:left;}
.doc-table th .ar{display:block;font-size:11px;text-transform:none;font-weight:700;margin-bottom:1px;direction:rtl;}
.bi-label{display:flex;flex-direction:column;gap:1px;}
.bi-label .ar{font-size:11.5px;font-weight:700;color:#233;}
.bi-label .en{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:#8493a8;}
.doc-table td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid #e7ebf2;}
.doc-totals{margin-left:auto;width:250px;margin-top:14px;}
.doc-totals .ln{display:flex;justify-content:space-between;font-size:12px;color:#555;padding:3px 0;}
.doc-totals .gt{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--navy-900);border-top:2px solid var(--navy-900);margin-top:6px;padding-top:8px;}
.doc-footer{margin-top:26px;text-align:center;border-top:1px dashed #ccc;padding-top:14px;}
.doc-footer .thanks{font-family:'Space Grotesk';font-weight:700;color:var(--navy-900);font-size:13px;}
.doc-footer .fine{font-size:10.5px;color:#8493a8;margin-top:4px;}
.side-actions{display:flex;flex-direction:column;gap:9px;}

@media(max-width:1100px){
  .kpi-grid,.quick-grid{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .invoice-view-grid{grid-template-columns:1fr;}
}
@media(max-width:720px){
  .sidebar{position:fixed;left:-260px;z-index:50;transition:left .2s ease;}
  .sidebar.open{left:0;}
  .kpi-grid,.quick-grid{grid-template-columns:1fr;}
}

@media print{
  .sidebar,.topbar,.side-actions,.no-print{display:none !important;}
  .content{padding:0;}
  .doc-preview{box-shadow:none;border:none;}
}
</style>
</head>
<body>
